[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-hybrid-engine"
version = "0.1.0"
description = "Compact local controller for Codex CLI and optional OpenAI-compatible providers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
hybrid = "hybrid.cli:main"

[tool.setuptools.packages.find]
include = ["hybrid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

